          <div class="logo">
            <img src="images/image_ec4fb5e3.jpg" alt="logo" />
          </div>
          <p>TACHKILA</p>
        </div>

        <div class="team-info flex gap-5">
          <div class="team1 text-yellow-300">GB</div>
          <div class="team2 text-blue-700">DEF</div>
          <div class="team3 text-green-300">MIL</div>
          <div class="team4 text-orange-500">ATT</div>
        </div>

        <div class="team-schema flex gap-10 items-center">
          <p>Schéma</p>
          <div class="schema p-1">4-4-2</div>
        </div>
      </div>
    </header>

        <div class="selective flex flex-wrap justify-between gap-1">
          <button

            class="add-new-player bg-lime-500 p-1.5 text-white rounded-md mt-2 w-full"
          >
            + Ajouter un joueur
          </button>
          <p class="text-white">Effectif</p>
          <div class="number-Of-players text-white">1 joueur(s)</div>
        </div>

        <div class="text font-medium mt-2 text-white">
          cliquer sur un joueur placé pour voir sa case sur le terrain.pour
          modifie, pour supprimer.
        </div>

        <div class="selection-menu mt-3">
          <div class="selected-player flex justify-between border-2">
            <div class="info flex gap-1 justify-center items-center">
              <div
                class="player-number p-1 border-2 rounded-[50%] text-orange-600"
              >
                1
              </div>
              <div class="player-name">bono</div>
              <div class="player-position text-orange-600">gardien</div>
            </div>
            <div class="actions flex items-center">
              <div class="edit">edit</div>
              <div class="delete">delete</div>
            </div>
          </div>
          <div class="players-list mt-2">
            <select name="w-full border rounded p-2 player-selection ">
              <option value="1">player 1</option>
              <option value="2">player 2</option>
              <option value="3">player 3</option>
            </select>
          </div>
        </div>

          <div class="row1 flex justify-between">
            <div class="title font-medium">Aouter un joueur</div>
            <button class="close text-slate-900">x</button>
          </div>
          <div class="row2 flex flex-col">
            <label for="playerName" class="text-xs">Nom Complete</label>
            <input
              type="text"
              id="playerName"
              name="playerName"
              placeholder="Ex. ayoub mansouri"
            />
          </div>
          <div class="postes flex flex-wrap gap-[1%] gap-y-[10px]">
            <p class="w-[100%]">poste</p>
            <!-- inputs choices -->
            <input
              id="gardien"
              type="radio"
              value="Gardien"
              class="poste bg-slate-800 rounded-md before:content-[''] before:bg-orange-500 before:rounded-[50%] before:inline-block before:w-[6px] before:h-[6px] before:top-[50%]"
            />
            <label for="gardien">Gardien</label>
          </div>
          <div class="row3">
            <label for="playerNumber">Numéro (1 a 99)</label>
            <input id="playerNumber" name="playerNumber" placeholder="Ex. 7" />
          </div>
          <div class="actionButtons">
            <button class="add">Ajouter</button>

          </div>
